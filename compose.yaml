services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edge-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - ./secrets/mosquitto/password_file:/mosquitto/secrets/password_file:ro
      - mosquitto_data:/mosquitto/data

volumes:
  mosquitto_data:
